# Spec: https://spec.openapis.org/oas/v3.2.0.html
# Supported: QUERY, additionalOperations, components.mediaTypes
# Unsupported: querystring and streaming media types

openapi: 3.2.0
info:
  title: OpenAPI 3.2 Features
  version: 1.0.0

tags:
  - name: api
    summary: API operations
    kind: nav
  - name: widgets
    summary: Widget operations
    parent: api
    kind: nav
  - name: documents
    summary: Document operations
    parent: api
    kind: nav
  # Streaming responses described with itemSchema are not supported yet.
  # - name: logs
  #   summary: Log operations
  #   parent: api
  #   kind: nav

paths:
  /documents/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    additionalOperations:
      LINK:
        tags: [documents]
        operationId: linkDocument
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                required: [target]
                properties:
                  target:
                    type: string
        responses:
          "204": {}

  /widgets/query:
    query:
      tags: [widgets]
      operationId: queryWidgets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WidgetFilters"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Widget"

  /widgets/{id}:
    get:
      tags: [widgets]
      operationId: getWidget
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              $ref: "#/components/mediaTypes/Widget"

  # Streaming responses described with itemSchema are not supported yet.
  # /logs:
  #   get:
  #     tags: [logs]
  #     operationId: streamLogs
  #     responses:
  #       "200":
  #         content:
  #           application/jsonl:
  #             itemSchema:
  #               $ref: "#/components/schemas/LogEntry"

components:
  mediaTypes:
    Widget:
      schema:
        $ref: "#/components/schemas/Widget"

  schemas:
    Widget:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string

    WidgetFilters:
      type: object
      properties:
        name:
          type: string
        active:
          type: boolean

    # Streaming responses described with itemSchema are not supported yet.
    # LogEntry:
    #   type: object
    #   required: [timestamp, message]
    #   properties:
    #     timestamp:
    #       type: string
    #       format: date-time
    #     message:
    #       type: string
